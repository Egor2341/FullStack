name: CI/CD

on:
  pull_request:
  push:
    branches: ["main", "master"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (lint, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20.20.2"
          cache: "npm"
          # Allow for different folder casing in repo
          cache-dependency-path: |
            src/frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test:run

      - name: Build
        run: npm run build

      - name: Docker build (frontend)
        run: docker build -t treasury-frontend:ci .

  backend:
    name: Backend (lint, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.15"
          cache: "pip"
          # Cache based on the actual CI requirements file; allow folder casing differences
          cache-dependency-path: |
            src/backend/requirements.ci.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r src/backend/requirements.ci.txt

      - name: Lint (black)
        run: python -m black --config src/backend/.black --check src/backend/app tests/backend

      - name: Lint (flake8)
        run: python -m flake8 --config src/backend/.flake8 src/backend/app

      - name: Test
        run: python -m pytest -c src/backend/pytest.ini -q tests/backend/unit tests/backend/integration

      - name: Docker build (backend)
        run: docker build -t treasury-backend:ci src/backend

  deploy:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # FRONTEND IMAGE
      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./src/frontend
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/treasury-frontend:latest

      # BACKEND IMAGE
      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: ./src/backend
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/treasury-backend:latest
