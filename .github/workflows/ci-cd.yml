name: CI/CD

on:
  pull_request:
  push:
    branches: ["main", "master"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (lint, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend/treasury
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          # Allow for different folder casing in repo
          cache-dependency-path: |
            Frontend/treasury/package-lock.json
            frontend/treasury/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test:run

      - name: Build
        run: npm run build

      - name: Docker build (frontend)
        run: docker build -t treasury-frontend:ci .

  backend:
    name: Backend (lint, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          # Cache based on the actual CI requirements file; allow folder casing differences
          cache-dependency-path: |
            Backend/requirements.ci.txt
            backend/requirements.ci.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.ci.txt

      - name: Lint (black)
        run: python -m black --check app tests

      - name: Lint (flake8)
        run: python -m flake8 app

      - name: Test
        run: python -m pytest -q tests/unit tests/integration

      - name: Docker build (backend)
        run: docker build -t treasury-backend:ci .

  deploy:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # FRONTEND IMAGE
      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./Frontend/treasury
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/treasury-frontend:latest

      # BACKEND IMAGE
      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: ./Backend
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/treasury-backend:latest