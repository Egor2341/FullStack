server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html; # Папка с билдом
  index index.html;

  # SPA routing
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Backend API (FastAPI) reverse proxy
  location /api/ {
    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Basic hardening
  add_header X-Content-Type-Options nosniff always; # Запрет на использование неизвестных типов контента
  add_header X-Frame-Options SAMEORIGIN always; # Запрет на использование фреймов
  add_header Referrer-Policy strict-origin-when-cross-origin always;
}

# Пользователь открывает сайт, Nginx отдает React
# React делает запрос к api, Nginx проксирует его на Backend

